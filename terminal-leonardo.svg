<text x="340.0" y="21.0" text-anchor="middle" font-size="12" font-weight="600" fill="#55606e" font-family="-apple-system, Segoe UI, Roboto, sans-serif">leonardo &#8212; bash &#8212; 80x24</text>
<text x="18" y="68" class="ln l0" font-style="normal" font-weight="normal" fill="#f5f5f5"><tspan fill="#3ecf6b">$</tspan> whoami</text><text x="18" y="90" class="ln l1" font-style="normal" font-weight="bold" fill="#6ad3e8">It&#x27;s me, Leonardo</text><text x="18" y="126" class="ln l2" font-style="normal" font-weight="normal" fill="#f5f5f5"><tspan fill="#3ecf6b">$</tspan> cat about.txt</text><text x="18" y="148" class="ln l3" font-style="normal" font-weight="normal" fill="#d6d9dc">Welcome to my profile, I&#x27;m Leonardo, an occasional developer</text><text x="18" y="170" class="ln l4" font-style="normal" font-weight="normal" fill="#d6d9dc">and student based in Italy. I usually work on open source</text><text x="18" y="192" class="ln l5" font-style="normal" font-weight="normal" fill="#d6d9dc">projects in my freetime.</text><text x="18" y="228" class="ln l6" font-style="normal" font-weight="normal" fill="#f5f5f5"><tspan fill="#3ecf6b">$</tspan> cat currently.txt</text><text x="18" y="250" class="ln l7" font-style="normal" font-weight="bold" fill="#6ad3e8">What I&#x27;m working on</text><text x="18" y="272" class="ln l8" font-style="normal" font-weight="normal" fill="#d6d9dc">I&#x27;m currently working on many projects I really hope you&#x27;ll</text><text x="18" y="294" class="ln l9" font-style="normal" font-weight="normal" fill="#d6d9dc">see one day.</text><text x="18" y="330" class="ln l10" font-style="normal" font-weight="normal" fill="#f5f5f5"><tspan fill="#3ecf6b">$</tspan> cat contacts.txt</text><text x="18" y="352" class="ln l11" font-style="normal" font-weight="bold" fill="#6ad3e8">Contacts</text><text x="18" y="374" class="ln l12" font-style="normal" font-weight="normal" fill="#d6d9dc">You can contact me through my email if you want to collab</text><text x="18" y="396" class="ln l13" font-style="normal" font-weight="normal" fill="#d6d9dc">on a project.</text><text x="18" y="432" class="ln l14" font-style="normal" font-weight="normal" fill="#f5f5f5"><tspan fill="#3ecf6b">$</tspan> fortune</text><text x="18" y="454" class="ln l15" font-style="italic" font-weight="normal" fill="#d6d9dc">“The people who are crazy enough to think they can change</text><text x="18" y="476" class="ln l16" font-style="italic" font-weight="normal" fill="#d6d9dc">the world are the ones who do”</text><text x="18" y="498" class="ln l17" font-style="normal" font-weight="normal" fill="#8a8f98">&#160;&#160;—&#160;Steve&#160;Jobs</text>
<text x="18" y="544" fill="#f5f5f5"><tspan fill="#3ecf6b">$</tspan> <tspan class="cursor">&#9608;</tspan></text>
